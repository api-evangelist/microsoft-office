  transport: http
  docs: https://learn.microsoft.com/en-us/graph/mcp-server/overview
  catalog: https://github.com/microsoft/mcp
  status: public-preview
  scope_note: >-
    Read-only Microsoft Entra identity/directory scenarios (users, groups,
    applications, devices, admin reporting), honoring user roles and granted scopes.
tools:
