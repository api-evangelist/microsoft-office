  Enterprise" is a read-only, RAG-assisted server over Microsoft Graph, in public
  preview. Its documented tools are captured below; the candidate_tools[] block
  maps the OpenAPI operations in this repo to potential MCP tools for a fuller
  Office-oriented server.
server:
