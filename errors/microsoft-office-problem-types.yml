format: microsoft-graph-error
description: >-
  Microsoft Graph does NOT use RFC 9457 problem+json. Errors are returned as a
  JSON object with a top-level "error" member carrying a machine-readable "code",
  a human-readable "message", and an "innerError" with a request-id and date for
  support. Codes below are Graph's documented top-level error codes; HTTP status
  codes are the standard status mapping Graph documents.
envelope:
  field: error
  shape:
    error:
      code: string
      message: string
      innerError:
        code: string
        request-id: string
        client-request-id: string
        date: string
http_status_codes:
  - {status: 400, meaning: Bad Request - cannot be processed}
  - {status: 401, meaning: Unauthorized - missing/invalid authentication token}
  - {status: 403, meaning: Forbidden - insufficient permissions/scope}
  - {status: 404, meaning: Not Found - resource does not exist}
  - {status: 405, meaning: Method Not Allowed}
  - {status: 406, meaning: Not Acceptable}
  - {status: 409, meaning: Conflict - current state conflicts with request}
  - {status: 410, meaning: Gone - resource no longer available}
  - {status: 411, meaning: Length Required}
  - {status: 412, meaning: Precondition Failed (eTag mismatch)}
  - {status: 413, meaning: Request Entity Too Large}
  - {status: 415, meaning: Unsupported Media Type}
  - {status: 416, meaning: Requested Range Not Satisfiable}
  - {status: 422, meaning: Unprocessable Entity}
  - {status: 423, meaning: Locked}
  - {status: 429, meaning: Too Many Requests - throttling; honor Retry-After}
  - {status: 500, meaning: Internal Server Error}
  - {status: 501, meaning: Not Implemented}
  - {status: 503, meaning: Service Unavailable - honor Retry-After}
  - {status: 504, meaning: Gateway Timeout}
