generated: '2026-06-20'
method: searched
source: https://learn.microsoft.com/en-us/graph/sdks/sdk-installation
description: >-
  First-party Microsoft Graph SDK client libraries. Microsoft Graph is the
  unified API surface for the Office 365 services in this repo (Outlook, OneDrive,
  Teams, Word/Excel/PowerPoint files), so the Graph SDKs are the packages a
  developer installs to work with this collection.
packages:
  - language: javascript
    registry: npm
    name: "@microsoft/microsoft-graph-client"
    url: https://www.npmjs.com/package/@microsoft/microsoft-graph-client
    install: npm install @microsoft/microsoft-graph-client
    official: true
  - language: typescript
    registry: npm
    name: "@microsoft/microsoft-graph-types"
    url: https://www.npmjs.com/package/@microsoft/microsoft-graph-types
    install: npm install @microsoft/microsoft-graph-types
    official: true
    note: TypeScript type definitions for Microsoft Graph entities.
  - language: python
    registry: pypi
    name: msgraph-sdk
    url: https://pypi.org/project/msgraph-sdk/
    install: pip install msgraph-sdk
    official: true
  - language: dotnet
    registry: nuget
    name: Microsoft.Graph
    url: https://www.nuget.org/packages/Microsoft.Graph/
    install: dotnet add package Microsoft.Graph
    official: true
  - language: dotnet
    registry: nuget
    name: Microsoft.Graph.Core
    url: https://www.nuget.org/packages/Microsoft.Graph.Core/
    install: dotnet add package Microsoft.Graph.Core
    official: true
  - language: java
    registry: maven
    name: com.microsoft.graph:microsoft-graph
    url: https://central.sonatype.com/artifact/com.microsoft.graph/microsoft-graph
    install: "implementation 'com.microsoft.graph:microsoft-graph'"
    official: true
  - language: go
    registry: pkg.go.dev
    name: github.com/microsoftgraph/msgraph-sdk-go
    url: https://pkg.go.dev/github.com/microsoftgraph/msgraph-sdk-go
    install: go get github.com/microsoftgraph/msgraph-sdk-go
    official: true
  - language: php
    registry: packagist
    name: microsoft/microsoft-graph
    url: https://packagist.org/packages/microsoft/microsoft-graph
    install: composer require microsoft/microsoft-graph
    official: true
  - language: powershell
    registry: powershell-gallery
    name: Microsoft.Graph
    url: https://www.powershellgallery.com/packages/Microsoft.Graph
    install: Install-Module Microsoft.Graph
    official: true
    note: Microsoft Graph PowerShell SDK (module family).
